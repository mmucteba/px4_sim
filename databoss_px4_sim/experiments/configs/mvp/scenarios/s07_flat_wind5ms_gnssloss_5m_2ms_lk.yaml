run:
  name: s07_flat_wind5ms_gnssloss_5m_2ms_lk
  description: >-
    Flat 5 m/s wind GNSS-loss LK case; isolates wind relative to s02 while
    keeping flat 600 m world scale, altitude, commanded speed, GNSS loss,
    vehicle, and flow tuning unchanged. Flow rate is 2.0 m/s / 5.0 m =
    0.400 rad/s, ratio 0.400 / 0.303 = 1.32x the EKF2_OF_N_MIN noise floor.
    Recommended launch values: hover_s=70, post_loss_hover_s unset or 60 if
    set explicitly; computed as 60 s commanded hold + control.start_after_takeoff_s
    5 s + control.warmup_s 2 s + runner gnss_loss_after_offboard default 3 s.
    Distance during the 60 s commanded hold is 120 m, which fits inside the
    600 x 600 m world.
vehicle:
  model: gz_x500_cam_lidar_down
  px4_airframe: x500_cam_lidar_down
  gazebo_model_name: x500_cam_lidar_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 1.65
    yaw_deg: 0
world:
  name: flat_rural_phototex_600m_noon_wind5ms
  sdf_path: generated_worlds/flat_rural_phototex_600m_noon_wind5ms.sdf
  lighting: noon_clear_no_shadows
  wind: crosswind_5ms
  texture: photo_speckle
  condition_is_physical: true
route:
  name: s07_flat_wind5ms_gnssloss_5m_2ms_lk
  type: hover
  altitude_agl_m: 5.0
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: true
  loss_after_takeoff_s: 10
  restore_after_run: true
failsafe:
  profile: delayed_observation
camera:
  proof_enabled: true
  description: Downward camera timing proof over the flat_rural_phototex_600m_noon_wind5ms speckle ground plane.
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: -screen 0 1280x1024x24
  headless_rendering: false
  probe_timeout_s: 25
rangefinder:
  proof_enabled: true
  description: Downward rangefinder timing proof over the flat_rural_phototex_600m_noon_wind5ms ground plane.
  render_engine: ogre
  xvfb_enabled: true
  probe_timeout_s: 20
  min_ulog_rows: 50
  height_agreement_tolerance_m: 0.75
visualization:
  gazebo_web:
    enabled: true
    required: true
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: none
  enabled: false
  external_odom_enabled: false
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: false
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: false
  check_optical_flow_fusion: true
  sensor_contract_report: true
  sensor_contract_gate: timing
  sensor_contract_gate_required: false
flow_recording:
  enabled: true
  rate_hz: 2
  max_width: 640
flow_bridge:
  enabled: true
  estimator: lk
  rate_hz: 40
  max_width: 320
  hfov_rad: 1.74
  axis_map: xy
  quality_in_min: 20
  quality_in_max: 100
  lk_max_corners: 160
  lk_quality_level: 0.01
  lk_min_distance: 6.0
  lk_min_tracks: 8
  lk_mad_multiplier: 3.0
  lk_max_flow_rate_rad_s: 7.4
  send_min_quality: 0
  send_min_matches: 0
  reset_on_unsent: false
  prime_on_unsent: true
  startup_prime_hz: 2
  startup_prime_duration_s: 120
  prearm_min_mavlink_samples: 3
  prearm_timeout_s: 30
  min_sent_samples: 100
  ekf2_of_ctrl: 1
  ekf2_of_qmin: 17
  ekf2_of_n_min: 0.3
  ekf2_of_delay: 140
control:
  mode: offboard_local_position_hold
  setpoint_mode: velocity_xy_position_z
  start_after_takeoff_s: 5
  warmup_s: 2
  sim_time_wall_multiplier: 30
  rate_hz: 20
  x_m: 0
  y_m: 0
  z_m: -5.0
  vx_m_s: 0.0
  vy_m_s: 2.0
  vz_m_s: 0.0
  yaw_deg: 0
  skip_landing_command: false
extra_px4_params:
  # EKF2_RNG_CTRL 2 = always-on range fusion. Conditional mode (stock 1) also
  # requires horizontal velocity < EKF2_RNG_A_VMAX, stock 1.0 m/s and capped at
  # 2.0, so at this scenario's commanded speed the rangefinder would never be
  # fused for absolute height and it would drift on baro after GNSS loss --
  # exactly the phase 14a failure, reproduced by run 20260730_125151.
  EKF2_RNG_CTRL: 2
  # Phase 14a value; valid on flat terrain, below the 100 m lidar max.
  EKF2_RNG_A_HMAX: 80
  SIM_BAT_DRAIN: 3000
  SIM_BAT_MIN_PCT: 95
