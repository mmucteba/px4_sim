run:
  name: phase8i_d_loss_flow_serefli_koschisar_flowtex
  description: Phase 8I Case D, repaired Sereflikochisar flowtex terrain, GNSS loss with live camera+TF03 optical-flow bridge, common slow +Y local-hold route.
vehicle:
  model: gz_x500_cam_lidar_down
  px4_airframe: x500_cam_lidar_down
  gazebo_model_name: x500_cam_lidar_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 1.65
    yaw_deg: 0
world:
  name: serefli_koschisar_flowtex
  sdf_path: generated_worlds/terrain/serefli_koschisar_flowtex/serefli_koschisar_flowtex.world
  home:
    lat_deg: 38.9667425790774
    lon_deg: 33.564598215693906
    alt_m: 1079.4
  lighting: real_satellite_texture_plus_flow_detail
  wind: none
  texture: terrain_flow_detail_overlay
  condition_is_physical: true
route:
  name: phase8i_slow_y_60s
  type: hover
  altitude_agl_m: 2.5
  duration_s: 60
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: true
  loss_after_takeoff_s: 10
  restore_after_run: true
failsafe:
  profile: delayed_observation
camera:
  proof_enabled: true
  description: Downward mono camera proof over the repaired flow-scale terrain overlay.
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: -screen 0 1280x1024x24
  headless_rendering: false
  probe_timeout_s: 25
rangefinder:
  proof_enabled: true
  description: Downward TF03-style gpu_lidar proof over the terrain collision surface.
  render_engine: ogre
  xvfb_enabled: true
  probe_timeout_s: 20
  min_ulog_rows: 50
  height_agreement_tolerance_m: 0.75
visualization:
  gazebo_web:
    enabled: true
    required: true
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: none
  enabled: false
  external_odom_enabled: false
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: false
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: false
  check_optical_flow_fusion: true
flow_recording:
  enabled: true
  rate_hz: 0
  max_width: 640
  min_frames: 100
flow_bridge:
  enabled: true
  estimator: sift
  rate_hz: 10
  max_width: 480
  hfov_rad: 1.74
  axis_map: "-yx"
  quality_in_min: 20
  quality_in_max: 100
  min_sent_samples: 100
  ekf2_of_ctrl: 1
  ekf2_of_qmin: 17
control:
  mode: offboard_local_position_hold
  setpoint_mode: velocity_xy_position_z
  start_after_takeoff_s: 5
  warmup_s: 2
  gnss_loss_after_offboard_s: 3
  sim_time_wall_multiplier: 30
  rate_hz: 20
  x_m: 0
  y_m: 0
  z_m: -2.5
  vx_m_s: 0.0
  vy_m_s: 0.2
  vz_m_s: 0.0
  yaw_deg: 0
