run:
  name: phase8i_c_loss_idealodom_serefli_koschisar_flowtex
  description: Phase 8I Case C, repaired Sereflikochisar flowtex terrain, GNSS loss with truth-fed external horizontal position/velocity upper anchor and TF03 height, common slow +Y local-hold route.
vehicle:
  model: gz_x500_cam_lidar_down
  px4_airframe: x500_cam_lidar_down
  gazebo_model_name: x500_cam_lidar_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 1.65
    yaw_deg: 0
world:
  name: serefli_koschisar_flowtex
  sdf_path: generated_worlds/terrain/serefli_koschisar_flowtex/serefli_koschisar_flowtex.world
  home:
    lat_deg: 38.9667425790774
    lon_deg: 33.564598215693906
    alt_m: 1079.4
  lighting: real_satellite_texture_plus_flow_detail
  wind: none
  texture: terrain_flow_detail_overlay
  condition_is_physical: true
route:
  name: phase8i_slow_y_60s
  type: hover
  altitude_agl_m: 2.5
  duration_s: 60
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: true
  loss_after_takeoff_s: 10
  restore_after_run: true
failsafe:
  profile: delayed_observation
camera:
  proof_enabled: true
  description: Downward mono camera proof over the repaired flow-scale terrain overlay.
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: -screen 0 1280x1024x24
  headless_rendering: false
  probe_timeout_s: 25
rangefinder:
  proof_enabled: true
  description: Downward TF03-style gpu_lidar proof over the terrain collision surface.
  render_engine: ogre
  xvfb_enabled: true
  probe_timeout_s: 20
  min_ulog_rows: 50
  height_agreement_tolerance_m: 0.75
visualization:
  gazebo_web:
    enabled: true
    required: true
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: synthetic_external_odometry
  enabled: true
  source: gazebo_truth
  input_path: mavlink_odometry_to_vehicle_visual_odometry
  frame: px4_local_ned
  rate_hz: 30
  mav_frame: local_enu
  velocity_source: finite_difference
  velocity_alpha: 0.35
  max_finite_diff_speed_m_s: 30.0
  velocity_reject_action: hold_last
  quality: 100
  noise:
    position_std_m: 0.10
    velocity_std_m_s: 1.00
    yaw_std_deg: 30.0
  latency_ms: 0
  dropout:
    enabled: false
  ekf2_ev_ctrl: 5
  ekf2_hgt_ref: 2
  ekf2_ev_delay_ms: 0
  allow_experimental_velocity_fusion: true
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: true
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: true
  compare_against_no_aiding: true
control:
  mode: offboard_local_position_hold
  setpoint_mode: velocity_xy_position_z
  start_after_takeoff_s: 5
  warmup_s: 2
  gnss_loss_after_offboard_s: 3
  sim_time_wall_multiplier: 30
  rate_hz: 20
  x_m: 0
  y_m: 0
  z_m: -2.5
  vx_m_s: 0.0
  vy_m_s: 0.2
  vz_m_s: 0.0
  yaw_deg: 0
