run:
  name: phase8i_pre_serefli_flowtex_camera_proof
  description: >
    Pre-8I proof for repaired Sereflikochisar terrain visuals: combined
    camera+TF03 vehicle over the flow-texture terrain variant, with every-frame
    camera/range recording for SIFT feature inspection.
vehicle:
  model: gz_x500_cam_lidar_down
  px4_airframe: x500_cam_lidar_down
  gazebo_model_name: x500_cam_lidar_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 1.65
    yaw_deg: 0
world:
  name: serefli_koschisar_flowtex
  sdf_path: generated_worlds/terrain/serefli_koschisar_flowtex/serefli_koschisar_flowtex.world
  home:
    lat_deg: 38.9667425790774
    lon_deg: 33.564598215693906
    alt_m: 1079.4
  lighting: real_satellite_texture_plus_flow_detail
  wind: none
  texture: terrain_flow_detail_overlay
  condition_is_physical: true
route:
  name: hover_30s_cam_lidar_terrain_flowtex
  type: hover
  altitude_agl_m: 2.5
  duration_s: 30
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: false
  loss_after_takeoff_s: null
  restore_after_run: true
failsafe:
  profile: default
camera:
  proof_enabled: true
  description: Downward mono camera over flow-scale textured terrain overlay.
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: -screen 0 1280x1024x24
  headless_rendering: false
  probe_timeout_s: 25
rangefinder:
  proof_enabled: true
  description: Single-point downward gpu_lidar over the original terrain/pad collision.
  render_engine: ogre
  xvfb_enabled: true
  probe_timeout_s: 20
  min_ulog_rows: 50
  height_agreement_tolerance_m: 0.75
visualization:
  gazebo_web:
    enabled: true
    required: true
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: none
  enabled: false
  external_odom_enabled: false
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: false
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: false
flow_recording:
  enabled: true
  rate_hz: 0
  max_width: 640
  min_frames: 100
