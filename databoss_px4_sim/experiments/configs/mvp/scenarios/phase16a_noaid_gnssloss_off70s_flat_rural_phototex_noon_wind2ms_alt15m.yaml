run:
  name: phase16a_noaid_gnssloss_off70s_flat_rural_phototex_noon_wind2ms_alt15m
  description: 'Phase 16a wind batch. Identical to the accepted Phase 14a run ''phase14a_noaid_gnssloss_off70s_flat_rural_phototex_noon_alt15m''
    -- same world, route, GNSS timing, flow tuning, and extra_px4_params -- with a steady 2.0 m/s crosswind
    now physically enabled via gz-sim''s WindEffects plugin (blowing toward geographic north, perpendicular
    to the vy=0.2 m/s East-bound flight path) as the sole changed variable. Case: unaided baseline (no
    optical flow, no GNSS after loss).'
vehicle:
  model: gz_x500_cam_lidar_down
  px4_airframe: x500_cam_lidar_down
  gazebo_model_name: x500_cam_lidar_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 0
    yaw_deg: 0
world:
  name: flat_rural_phototex_noon_wind2ms
  sdf_path: generated_worlds/flat_rural_phototex_noon_wind2ms.sdf
  lighting: noon_clear_no_shadows
  wind: crosswind_2ms
  texture: photo_speckle
  condition_is_physical: true
route:
  name: phase14a_noaid_gnssloss_off70s_vy_wind2ms_alt15m
  type: hover
  altitude_agl_m: 15.0
  duration_s: 70
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: true
  loss_after_takeoff_s: 10
  restore_after_run: true
failsafe:
  profile: delayed_observation
camera:
  proof_enabled: true
  description: Downward camera timing proof (not used for aiding in this case
  kept only for sensor-contract parity with LK/SIFT).: null
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: -screen 0 1280x1024x24
  headless_rendering: false
  probe_timeout_s: 25
rangefinder:
  proof_enabled: true
  description: Downward rangefinder timing proof
  render_engine: ogre
  xvfb_enabled: true
  probe_timeout_s: 20
  min_ulog_rows: 50
  height_agreement_tolerance_m: 0.75
visualization:
  gazebo_web:
    enabled: true
    required: true
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: none
  enabled: false
  external_odom_enabled: false
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: false
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: false
  check_optical_flow_fusion: false
  sensor_contract_report: true
  sensor_contract_gate: timing
  sensor_contract_gate_required: false
control:
  mode: offboard_local_position_hold
  setpoint_mode: velocity_xy_position_z
  start_after_takeoff_s: 5
  warmup_s: 2
  gnss_loss_after_offboard_s: 3
  sim_time_wall_multiplier: 30
  rate_hz: 20
  x_m: 0
  y_m: 0
  z_m: -15.0
  vx_m_s: 0.0
  vy_m_s: 0.2
  vz_m_s: 0.0
  yaw_deg: 0
  skip_landing_command: true
extra_px4_params:
  EKF2_RNG_A_HMAX: 80
  SIM_BAT_DRAIN: 3000
  SIM_BAT_MIN_PCT: 95
  COM_OF_LOSS_T: 20
  NAV_DLL_ACT: 0
