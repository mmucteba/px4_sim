run:
  name: phase8e_cam_lidar_flat_rural_low_texture_noon
  description: Phase 8E combined downward camera + TF03-style rangefinder vehicle in the generated low-texture rural world, with QGC and web monitoring.
vehicle:
  model: gz_x500_cam_lidar_down
  px4_airframe: x500_cam_lidar_down
  gazebo_model_name: x500_cam_lidar_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 0
    yaw_deg: 0
world:
  name: flat_rural_low_texture_noon
  sdf_path: generated_worlds/flat_rural_low_texture_noon.sdf
  lighting: noon_clear
  wind: none
  texture: low_texture
  condition_is_physical: true
route:
  name: hover_20s_cam_lidar
  type: hover
  altitude_agl_m: 2.5
  duration_s: 20
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: false
  loss_after_takeoff_s: null
  restore_after_run: true
failsafe:
  profile: default
camera:
  proof_enabled: true
  description: Downward mono camera frame publication proof on the combined vehicle.
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: "-screen 0 1280x1024x24"
  headless_rendering: false
  probe_timeout_s: 25
rangefinder:
  proof_enabled: true
  description: Single-point downward gpu_lidar proof on the combined vehicle.
  render_engine: ogre
  xvfb_enabled: true
  probe_timeout_s: 20
  min_ulog_rows: 50
  height_agreement_tolerance_m: 0.75
visualization:
  gazebo_web:
    enabled: true
    required: true
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: none
  enabled: false
  external_odom_enabled: false
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: false
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: false
