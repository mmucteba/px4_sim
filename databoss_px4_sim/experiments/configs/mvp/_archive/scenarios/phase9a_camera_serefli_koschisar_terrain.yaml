run:
  name: phase9a_camera_serefli_koschisar_terrain
  description: Phase 9A camera-over-terrain proof - downward mono camera over operator-generated Sereflikochisar heightmap with satellite texture (ogre + xvfb headless rendering).
vehicle:
  model: gz_x500_mono_cam_down
  px4_airframe: x500_mono_cam_down
  gazebo_model_name: x500_mono_cam_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 1.65
    yaw_deg: 0
world:
  name: serefli_koschisar
  sdf_path: generated_worlds/terrain/serefli_koschisar/serefli_koschisar.world
  home:
    lat_deg: 38.9667425790774
    lon_deg: 33.564598215693906
    alt_m: 1079.4
  lighting: real_satellite_texture
  wind: none
  texture: real_satellite_texture
  condition_is_physical: true
route:
  name: hover_30s_camera_terrain
  type: hover
  altitude_agl_m: 8.0
  duration_s: 30
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: false
  loss_after_takeoff_s: null
  restore_after_run: true
failsafe:
  profile: default
camera:
  proof_enabled: true
  description: Downward mono camera frame over satellite-textured heightmap.
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: "-screen 0 1280x1024x24"
  headless_rendering: false
  probe_timeout_s: 25
visualization:
  gazebo_web:
    enabled: true
    required: false
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: none
  enabled: false
  external_odom_enabled: false
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: false
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: false
