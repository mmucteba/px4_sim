run: {name: phase12_stock_gnsson_off70s_flat_rural_phototex_noon, description: Phase 12 unified comparison matrix GNSS-on case for PX4 stock optical flow. Same world, route, and stock_flow tuning as the accepted Phase 11 stock GNSS-loss comparators (20260720_122327/133743), just with GNSS never cut, so the pair is a true one-variable-changed comparison. This is the first GNSS-on stock run under this world/route at all. Adds a camera block with an explicit image_topic override, since stock's own optical_flow model (PX4 Tools/simulation/gz/models/optical_flow/model.sdf) uses link name flow_link and sensor name flow_camera, not the camera_link/camera convention the runner defaults to and that DATABOSS's own cam_lidar_down model uses -- the default topic guess would silently find nothing for this vehicle. Also adds flow_recording (absent from the GNSS-loss stock scenarios) at rate_hz 2 to capture camera frames within a bounded disk budget (~10MB/run, not the ~150MB/run the rate_hz 0 = uncapped setting costs on LK/SIFT).}
vehicle: {model: gz_x500_flow, px4_airframe: x500_flow, gazebo_model_name: x500_flow_0, start_pose: {x_m: 0, y_m: 0, z_m: 0, yaw_deg: 0}}
world: {name: flat_rural_phototex_noon, sdf_path: generated_worlds/flat_rural_phototex_noon.sdf, lighting: noon_clear_no_shadows, wind: none, texture: photo_speckle, condition_is_physical: true}
route: {name: phase12_stock_gnsson_off70s_vy, type: hover, altitude_agl_m: 2.5, duration_s: 70, waypoints: []}
gnss: {start_enabled: true, loss_enabled: false, loss_after_takeoff_s: null, restore_after_run: true}
failsafe: {profile: delayed_observation}
camera: {proof_enabled: true, image_topic: "/world/flat_rural_phototex_noon/model/x500_flow_0/link/flow_link/sensor/flow_camera/image", description: Downward camera timing proof via PX4 stock optical_flow model flow_link/flow_camera sensor (not the camera_link convention -- explicit override required)., render_engine: ogre, xvfb_enabled: true, xvfb_server_args: "-screen 0 1280x1024x24", headless_rendering: false, probe_timeout_s: 25}
rangefinder: {proof_enabled: true, description: PX4 stock x500_flow downward rangefinder proof., render_engine: ogre, xvfb_enabled: true, probe_timeout_s: 20, min_ulog_rows: 50, height_agreement_tolerance_m: 0.75}
visualization: {gazebo_web: {enabled: true, required: true, config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch, host: 127.0.0.1, port: 9003, publication_hz: 15, startup_timeout_s: 15}}
aiding: {mode: px4_stock_optical_flow, enabled: false, external_odom_enabled: false}
stock_flow: {enabled: true, ekf2_of_ctrl: 1, ekf2_of_qmin: 17, sens_flow_rot: 0, sens_flow_minhgt: 0.1, sens_flow_maxhgt: 100.0, sim_gz_en_flow: 1, sim_gz_en_lidar: 1}
logging: {record_ulog: true, record_gazebo_truth: true, record_sensor_logs: true, record_camera_topics: true, record_external_odometry_sent: false}
analysis: {align_with_gazebo_truth: true, generate_plots: true, generate_summary: true, check_external_odometry_received: false, check_optical_flow_fusion: true}
flow_recording: {enabled: true, rate_hz: 2, max_width: 640, min_frames: 100}
control: {mode: offboard_local_position_hold, setpoint_mode: velocity_xy_position_z, start_after_takeoff_s: 5, warmup_s: 2, sim_time_wall_multiplier: 30, rate_hz: 20, x_m: 0, y_m: 0, z_m: -2.5, vx_m_s: 0.0, vy_m_s: 0.2, vz_m_s: 0.0, yaw_deg: 0, skip_landing_command: true}
