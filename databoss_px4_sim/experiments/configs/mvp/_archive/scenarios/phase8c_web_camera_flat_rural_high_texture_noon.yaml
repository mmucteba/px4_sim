run:
  name: phase8c_web_camera_flat_rural_high_texture_noon
  description: Phase 8C web visualization proof in the generated high-texture rural Gazebo world.
vehicle:
  model: gz_x500_mono_cam_down
  px4_airframe: x500_mono_cam_down
  gazebo_model_name: x500_mono_cam_down_0
  start_pose:
    x_m: 0
    y_m: 0
    z_m: 0
    yaw_deg: 0
world:
  name: flat_rural_high_texture_noon
  sdf_path: generated_worlds/flat_rural_high_texture_noon.sdf
  lighting: noon_clear
  wind: none
  texture: high_texture
  condition_is_physical: true
route:
  name: hover_20s_web_view
  type: hover
  altitude_agl_m: 2.5
  duration_s: 20
  waypoints: []
gnss:
  start_enabled: true
  loss_enabled: false
  loss_after_takeoff_s: null
  restore_after_run: true
failsafe:
  profile: default
camera:
  proof_enabled: true
  description: Downward mono camera frame publication proof with Gazebo web visualization bridge.
  render_engine: ogre
  xvfb_enabled: true
  xvfb_server_args: "-screen 0 1280x1024x24"
  headless_rendering: false
  probe_timeout_s: 20
visualization:
  gazebo_web:
    enabled: true
    required: true
    config: /usr/share/gz/gz-launch7/configs/websocket.gzlaunch
    host: 127.0.0.1
    port: 9003
    publication_hz: 15
    startup_timeout_s: 15
aiding:
  mode: none
  enabled: false
  external_odom_enabled: false
logging:
  record_ulog: true
  record_gazebo_truth: true
  record_sensor_logs: true
  record_camera_topics: true
  record_external_odometry_sent: false
analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true
  check_external_odometry_received: false
