run:
  name: phase7d_hover_10m_gnss_loss_delayed_noon_wind_none
  description: Phase 7D schema smoke scenario. GNSS loss after takeoff with delayed-observation failsafe and easy conditions.

vehicle:
  model: gz_x500
  px4_airframe: x500

world:
  name: databoss_mvp_yard_120m
  fallback_sim_world: default

conditions:
  lighting: experiments/configs/mvp/conditions/lighting/noon_clear.yaml
  wind: experiments/configs/mvp/conditions/wind/none.yaml
  texture: experiments/configs/mvp/conditions/texture/high_texture.yaml

route:
  name: hover_60s
  type: hover
  altitude_agl_m: 10
  duration_s: 60

gnss:
  start_enabled: true
  loss_enabled: true
  loss_time_s: 5
  restore_after_run: true

failsafe:
  profile: delayed_observation

aiding:
  mode: gnss_off_no_aiding
  latency_ms: 0

logging:
  record_ulog: true
  record_gazebo_truth: true

analysis:
  align_with_gazebo_truth: true
  generate_plots: true
  generate_summary: true

matrix:
  phase: 7D
  family: capability
  execution_required: false
