batch:
  name: phase7b_gnss_cases
  description: Rerunnable GNSS-on and GNSS-loss automated PX4/Gazebo cases.

defaults:
  scenario: experiments/configs/mvp/scenarios/example_mvp_hover_10m_gnss_on.yaml
  startup_timeout_s: 150
  land_timeout_s: 70
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: baseline_gnss_on_hover_25s
    hover_s: 25
    gnss_start_used: 10
    gnss_loss_after_takeoff_s: null
    post_loss_hover_s: null

  - name: gnss_loss_after_takeoff_5s_post_25s
    hover_s: 25
    gnss_start_used: 10
    gnss_loss_after_takeoff_s: 5
    post_loss_hover_s: 25

  - name: gnss_loss_after_takeoff_15s_post_25s
    hover_s: 25
    gnss_start_used: 10
    gnss_loss_after_takeoff_s: 15
    post_loss_hover_s: 25

  - name: gnss_loss_after_takeoff_5s_post_45s
    hover_s: 45
    gnss_start_used: 10
    gnss_loss_after_takeoff_s: 5
    post_loss_hover_s: 45
