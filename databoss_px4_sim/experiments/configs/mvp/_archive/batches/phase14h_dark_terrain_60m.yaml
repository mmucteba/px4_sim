batch:
  name: phase14h_dark_terrain_60m
  description: Phase 14H dim-terrain 60 m endgame on serefli_koschisar_flowtex_dim at 60 m AGL. Uses the Phase 14F HMAX=5 height-reference strategy to avoid
    flat-ground rangefinder absolute-height anchoring over terrain relief; drift/rejection is accepted as endgame characterization
    evidence, suspicious GNSS/artifact failures are rerun.
defaults:
  hover_s: 90
  startup_timeout_s: 260
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 180
  global_position_stable_s: 8
  gnss_start_used: 10
  post_loss_hover_s: 50
  failsafe_profile: default_px4
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000
cases:
- name: lk_xy_gnssloss_terrain_60m
  scenario: experiments/configs/mvp/scenarios/phase14h_lk_xy_gnssloss_off50s_nmin03_serefli_koschisar_flowtex_dim_alt60m.yaml
  failsafe_profile: default_px4
- name: sift_xy_gnssloss_terrain_60m
  scenario: experiments/configs/mvp/scenarios/phase14h_sift_xy_gnssloss_off50s_serefli_koschisar_flowtex_dim_alt60m.yaml
  failsafe_profile: default_px4
- name: stock_gnssloss_terrain_60m_rep1
  scenario: experiments/configs/mvp/scenarios/phase14h_stock_gnssloss_off50s_serefli_koschisar_flowtex_dim_alt60m.yaml
  failsafe_profile: delayed_observation
- name: stock_gnssloss_terrain_60m_rep2
  scenario: experiments/configs/mvp/scenarios/phase14h_stock_gnssloss_off50s_serefli_koschisar_flowtex_dim_alt60m.yaml
  failsafe_profile: delayed_observation
- name: lk_xy_gnsson_terrain_60m
  scenario: experiments/configs/mvp/scenarios/phase14h_lk_xy_gnsson_off70s_serefli_koschisar_flowtex_dim_alt60m.yaml
  failsafe_profile: default_px4
- name: noaid_gnssloss_terrain_60m
  scenario: experiments/configs/mvp/scenarios/phase14h_noaid_gnssloss_off70s_serefli_koschisar_flowtex_dim_alt60m.yaml
  failsafe_profile: delayed_observation
