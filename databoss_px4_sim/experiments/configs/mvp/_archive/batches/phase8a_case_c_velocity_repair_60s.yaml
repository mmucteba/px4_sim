batch:
  name: phase8a_case_c_velocity_repair_60s
  description: Short GNSS-loss Case C repair candidate using external position, height, and validated finite-difference velocity aiding.

defaults:
  hover_s: 60
  startup_timeout_s: 150
  land_timeout_s: 70
  global_position_gate_enabled: true
  global_position_timeout_s: 120
  global_position_stable_s: 8
  gnss_start_used: 10
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: case_c_prime_gnss_loss_external_position_height_velocity
    scenario: experiments/configs/mvp/scenarios/phase8a_compare_2p5m_gnss_loss_external_position_height_velocity_repaired.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation
