batch:
  name: phase8j_lk_fixed_50s_probe_600m
  description: >
    Single long-outage proof run for the repaired LK bridge on the 600 m
    phototextured world, after the 240 m world produced boundary-induced inf
    range during divergence.

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 10
  post_loss_hover_s: 50
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: fixed_lk_50s_probe_600m
    scenario: experiments/configs/mvp/scenarios/phase8j_d_loss_flow_lk_flat_rural_phototex_600m_noon.yaml
