batch:
  name: phase8j_stock_flow_benchmark
  description: >
    Phase 8J Stage A stock PX4 Gazebo optical-flow benchmark on the same
    flat_rural_phototex_noon slow +Y profile used for Phase 8I D.

defaults:
  hover_s: 45
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: stock_gnsson_proof
    scenario: experiments/configs/mvp/scenarios/phase8j_stock_flow_gnsson_flat_rural_phototex_noon.yaml
    hover_s: 45
    failsafe_profile: default_px4

  - name: stock_short_loss
    scenario: experiments/configs/mvp/scenarios/phase8j_stock_flow_short_flat_rural_phototex_noon.yaml
    hover_s: 45
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 35
    failsafe_profile: delayed_observation

  - name: stock_50s_loss
    scenario: experiments/configs/mvp/scenarios/phase8j_stock_flow_50s_flat_rural_phototex_noon.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation
