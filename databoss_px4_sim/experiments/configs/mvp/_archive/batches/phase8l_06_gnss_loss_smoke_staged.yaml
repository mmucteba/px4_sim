batch:
  name: phase8l_06_gnss_loss_smoke_staged
  description: "Phase 8L gate 8. Staged GNSS-loss smoke: 10 s, 25 s, then 50 s only after earlier gates pass."

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 10
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: lk_loss_smoke_10s
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnss_loss_smoke_flat_rural_phototex_noon.yaml
    post_loss_hover_s: 10
  - name: lk_loss_smoke_25s
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnss_loss_smoke_flat_rural_phototex_noon.yaml
    post_loss_hover_s: 25
  - name: lk_loss_smoke_50s
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnss_loss_smoke_flat_rural_phototex_noon.yaml
    post_loss_hover_s: 50
