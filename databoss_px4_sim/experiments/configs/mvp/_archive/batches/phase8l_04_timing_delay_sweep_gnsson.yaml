batch:
  name: phase8l_04_timing_delay_sweep_gnsson
  description: Phase 8L gate 6. GNSS-on LK timing and EKF2_OF_DELAY sweep around the existing 111 ms default.

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  failsafe_profile: default_px4
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: lk_gnsson_delay60
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnsson_delay60_flat_rural_phototex_noon.yaml
  - name: lk_gnsson_delay90
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnsson_delay90_flat_rural_phototex_noon.yaml
  - name: lk_gnsson_delay111
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnsson_delay111_flat_rural_phototex_noon.yaml
  - name: lk_gnsson_delay140
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnsson_delay140_flat_rural_phototex_noon.yaml
  - name: lk_gnsson_delay180
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnsson_delay180_flat_rural_phototex_noon.yaml
