batch:
  name: phase8l_lk_failsafe_isolation
  description: "Phase 8L LK GNSS-loss failsafe-isolation run: keep LK measurement config fixed, apply delayed_observation failsafe and MPC_XY_VEL_MAX=2.0 containment."

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 20
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: lk_loss20_delayedcap
    scenario: experiments/configs/mvp/scenarios/phase8l_lk_gnssloss20_delayedcap_axisfix140_ofn05_flat_rural_phototex_noon.yaml
