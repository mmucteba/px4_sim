matrix:
  family: condition_reference_coverage
  lighting:
  - noon_clear
  - sunset_low_angle
  wind:
  - none
  - crosswind_5ms
  texture:
  - high_texture
  - low_texture
  condition_combinations: 8
  cases_per_combination: 2
  total_cases: 16
  note: This proves all condition presets are referenced and run. Physical Gazebo
    wind/sun/texture application is not wired yet.
