batch:
  name: phase7d_all_conditions_reference_smoke
  description: Phase 7D all-condition reference coverage batch. Runs every lighting/wind/texture
    condition combination with GNSS ON and GNSS-loss delayed cases.
  phase: 7D
defaults:
  scenario: experiments/configs/mvp/scenarios/example_mvp_hover_10m_gnss_on.yaml
  startup_timeout_s: 150
  land_timeout_s: 70
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000
  failsafe_profile: delayed_observation
cases:
- name: phase7d_gnss_on_noon_clear_none_high_texture
  hover_s: 25
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: null
  post_loss_hover_s: null
  failsafe_profile: default_px4
  scenario: experiments/configs/mvp/scenarios/phase7d_gnss_on_noon_clear_none_high_texture.yaml
  conditions:
    lighting: noon_clear
    wind: none
    texture: high_texture
- name: phase7d_gnss_loss_delayed_noon_clear_none_high_texture
  hover_s: 25
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 5
  post_loss_hover_s: 25
  failsafe_profile: delayed_observation
  scenario: experiments/configs/mvp/scenarios/phase7d_gnss_loss_delayed_noon_clear_none_high_texture.yaml
  conditions:
    lighting: noon_clear
    wind: none
    texture: high_texture
- name: phase7d_gnss_on_noon_clear_none_low_texture
