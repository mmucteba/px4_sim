batch:
  name: phase8m_lk_xnegyneg_50s_probe
  description: >
    Single-case 50 s GNSS-loss route probe: DATABOSS LK with axis_map -x-y.
    Stock PX4 flow reference remains the accepted Phase 8M stock run.

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 10
  post_loss_hover_s: 50
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: lk_xnegyneg_50s
    scenario: experiments/configs/mvp/scenarios/phase8m_lk_xnegyneg_flow_50s_flat_rural_phototex_noon.yaml
