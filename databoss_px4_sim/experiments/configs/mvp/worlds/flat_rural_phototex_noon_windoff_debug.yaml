world:
  name: flat_rural_phototex_noon_windoff_debug
  description: >
    Debug twin of flat_rural_phototex_noon_wind7ms with wind.enabled: false
    and nothing else changed (byte-identical otherwise), used to isolate
    whether the ~90-125s AUTO_TAKEOFF setpoint stall observed under 7 m/s
    wind (Phase 16A wind7ms 15m cases) is caused by the wind mechanism
    itself or is unrelated (resource contention / an existing regression).
    Not part of the Phase 16 wind roadmap batches -- throwaway debug world.

  generator:
    type: databoss_sdf
    sdf_version: "1.9"

  frame:
    world_frame: gazebo_world_enu
    navigation_frame: px4_local_ned
    origin_policy: align_at_takeoff

  size_m:
    x: 240
    y: 240

  terrain:
    type: flat
    elevation_source: none
    ground_z_m: 0

  texture:
    preset: photo_speckle
    visual_pattern: image_field
    image: generated_worlds/textures/ground_speckle_2048.png
    tile_size_m: 20

  lighting:
    preset: noon_clear_no_shadows
    sun_enabled: true
    shadows_enabled: false
    ambient: [0.55, 0.55, 0.55, 1.0]
    background: [0.70, 0.82, 0.95, 1.0]
    sun_direction: [-0.35, 0.15, -0.92]

  wind:
    enabled: false
    mean_mps: 7.0
    direction_vector_enu: [0.0, 1.0]
    gusts_enabled: false

  objects:
    - name: barn_low
      type: box
      pose_m: [28, -22, 3, 0, 0, 0]
      size_m: [14, 9, 6]
      color: [0.45, 0.12, 0.08, 1.0]

    - name: hay_block_a
      type: box
      pose_m: [-32, 18, 1.2, 0, 0, 0.35]
      size_m: [6, 4, 2.4]
      color: [0.70, 0.58, 0.22, 1.0]

    - name: field_marker_a
      type: cylinder
      pose_m: [45, 35, 1.5, 0, 0, 0]
      radius_m: 1.0
      length_m: 3.0
      color: [0.85, 0.85, 0.15, 1.0]
