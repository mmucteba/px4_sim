world:
  name: flat_rural_phototex_dim
  description: >
    Flat rural photo-textured world with dim/overcast lighting for Phase 14d.
    Cloned from flat_rural_phototex_noon with the same 240 m field, texture,
    objects, and shadows-off policy; only the lighting preset is changed.

  generator:
    type: databoss_sdf
    sdf_version: "1.9"

  frame:
    world_frame: gazebo_world_enu
    navigation_frame: px4_local_ned
    origin_policy: align_at_takeoff

  size_m:
    x: 240
    y: 240

  terrain:
    type: flat
    elevation_source: none
    ground_z_m: 0

  texture:
    preset: photo_speckle
    visual_pattern: image_field
    image: generated_worlds/textures/ground_speckle_2048.png
    tile_size_m: 20

  lighting:
    preset: dim_overcast_no_shadows
    sun_enabled: true
    shadows_enabled: false
    ambient: [0.25, 0.25, 0.25, 1.0]
    background: [0.36, 0.40, 0.45, 1.0]
    sun_direction: [-0.60, 0.20, -0.55]

  wind:
    enabled: false

  objects:
    - name: barn_low
      type: box
      pose_m: [28, -22, 3, 0, 0, 0]
      size_m: [14, 9, 6]
      color: [0.45, 0.12, 0.08, 1.0]

    - name: hay_block_a
      type: box
      pose_m: [-32, 18, 1.2, 0, 0, 0.35]
      size_m: [6, 4, 2.4]
      color: [0.70, 0.58, 0.22, 1.0]

    - name: field_marker_a
      type: cylinder
      pose_m: [45, 35, 1.5, 0, 0, 0]
      radius_m: 1.0
      length_m: 3.0
      color: [0.85, 0.85, 0.15, 1.0]
