world:
  name: flat_rural_low_texture_noon
  description: Flat rural reference world with low-texture ground for camera and optical-flow contrast tests.

  generator:
    type: databoss_sdf
    sdf_version: "1.9"

  frame:
    world_frame: gazebo_world_enu
    navigation_frame: px4_local_ned
    origin_policy: align_at_takeoff

  size_m:
    x: 120
    y: 120

  terrain:
    type: flat
    elevation_source: none
    ground_z_m: 0

  texture:
    preset: low_texture
    visual_pattern: uniform_field
    tile_size_m: 120
    primary_color: [0.31, 0.42, 0.22, 1.0]
    secondary_color: [0.31, 0.42, 0.22, 1.0]

  lighting:
    preset: noon_clear
    sun_enabled: true
    shadows_enabled: true
    ambient: [0.55, 0.55, 0.55, 1.0]
    background: [0.70, 0.82, 0.95, 1.0]
    sun_direction: [-0.35, 0.15, -0.92]

  wind:
    enabled: false

  objects:
    - name: barn_low
      type: box
      pose_m: [28, -22, 3, 0, 0, 0]
      size_m: [14, 9, 6]
      color: [0.45, 0.12, 0.08, 1.0]

    - name: hay_block_a
      type: box
      pose_m: [-32, 18, 1.2, 0, 0, 0.35]
      size_m: [6, 4, 2.4]
      color: [0.70, 0.58, 0.22, 1.0]

    - name: field_marker_a
      type: cylinder
      pose_m: [45, 35, 1.5, 0, 0, 0]
      radius_m: 1.0
      length_m: 3.0
      color: [0.85, 0.85, 0.15, 1.0]
