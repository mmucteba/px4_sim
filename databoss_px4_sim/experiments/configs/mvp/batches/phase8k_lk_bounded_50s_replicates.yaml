batch:
  name: phase8k_lk_bounded_50s_replicates
  description: >
    Phase 8K bounded-flow candidate replicate benchmark. LK bridge with
    stock-aligned 7.4 rad/s gate and no bridge-side send gating, on the same
    240x240 m flat_rural_phototex_noon world and 50 s GNSS-loss observation
    profile as the accepted stock 3/3 bounded reference batch.

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 10
  post_loss_hover_s: 50
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: lk_bounded_rep1
    scenario: experiments/configs/mvp/scenarios/phase8k_d_loss_flow_lk_flat_rural_phototex_noon.yaml

  - name: lk_bounded_rep2
    scenario: experiments/configs/mvp/scenarios/phase8k_d_loss_flow_lk_flat_rural_phototex_noon.yaml

  - name: lk_bounded_rep3
    scenario: experiments/configs/mvp/scenarios/phase8k_d_loss_flow_lk_flat_rural_phototex_noon.yaml
