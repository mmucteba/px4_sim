batch:
  name: phase8c_downward_camera_generated_world_smoke
  description: Phase 8C proof that the downward monocular camera x500 can fly in generated worlds and publish image frames during the flight window.

defaults:
  hover_s: 20
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 100
  global_position_stable_s: 5
  gnss_start_used: 10
  qgc:
    enabled: false

cases:
  - name: high_texture_downward_camera
    scenario: experiments/configs/mvp/scenarios/phase8c_camera_flat_rural_high_texture_noon.yaml
    failsafe_profile: default_px4

  - name: low_texture_downward_camera
    scenario: experiments/configs/mvp/scenarios/phase8c_camera_flat_rural_low_texture_noon.yaml
    failsafe_profile: default_px4
