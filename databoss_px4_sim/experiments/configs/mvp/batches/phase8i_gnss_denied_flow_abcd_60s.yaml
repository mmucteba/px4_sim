batch:
  name: phase8i_gnss_denied_flow_abcd_60s
  description: Phase 8I A/B/C/D comparison, 60 s common slow +Y local-hold profile at 2.5 m AGL in flat phototex and repaired Sereflikochisar flowtex worlds.

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: flat_a_gnsson
    scenario: experiments/configs/mvp/scenarios/phase8i_a_gnsson_flat_rural_phototex_noon.yaml
    hover_s: 60
    failsafe_profile: default_px4

  - name: flat_b_loss_noaid
    scenario: experiments/configs/mvp/scenarios/phase8i_b_loss_noaid_flat_rural_phototex_noon.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation

  - name: flat_c_loss_idealodom
    scenario: experiments/configs/mvp/scenarios/phase8i_c_loss_idealodom_flat_rural_phototex_noon.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation

  - name: flat_d_loss_flow
    scenario: experiments/configs/mvp/scenarios/phase8i_d_loss_flow_flat_rural_phototex_noon.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation

  - name: serefli_a_gnsson
    scenario: experiments/configs/mvp/scenarios/phase8i_a_gnsson_serefli_koschisar_flowtex.yaml
    hover_s: 60
    failsafe_profile: default_px4

  - name: serefli_b_loss_noaid
    scenario: experiments/configs/mvp/scenarios/phase8i_b_loss_noaid_serefli_koschisar_flowtex.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation

  - name: serefli_c_loss_idealodom
    scenario: experiments/configs/mvp/scenarios/phase8i_c_loss_idealodom_serefli_koschisar_flowtex.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation

  - name: serefli_d_loss_flow
    scenario: experiments/configs/mvp/scenarios/phase8i_d_loss_flow_serefli_koschisar_flowtex.yaml
    hover_s: 60
    gnss_loss_after_takeoff_s: 10
    post_loss_hover_s: 50
    failsafe_profile: delayed_observation
