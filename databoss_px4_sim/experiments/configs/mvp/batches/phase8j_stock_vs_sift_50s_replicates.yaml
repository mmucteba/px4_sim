batch:
  name: phase8j_stock_vs_sift_50s_replicates
  description: >
    Phase 8J long-outage replicate benchmark on the existing 240x240 m
    flat_rural_phototex_noon world. Runs PX4 stock gz_x500_flow and the
    current DATABOSS SIFT bridge three times each with the same 50 s GNSS-loss
    observation window and skip_landing_command scenarios.

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 10
  post_loss_hover_s: 50
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: stock_50s_rep1
    scenario: experiments/configs/mvp/scenarios/phase8j_stock_flow_50s_flat_rural_phototex_noon.yaml

  - name: stock_50s_rep2
    scenario: experiments/configs/mvp/scenarios/phase8j_stock_flow_50s_flat_rural_phototex_noon.yaml

  - name: stock_50s_rep3
    scenario: experiments/configs/mvp/scenarios/phase8j_stock_flow_50s_flat_rural_phototex_noon.yaml

  - name: sift_50s_rep1
    scenario: experiments/configs/mvp/scenarios/phase8i_d_loss_flow_flat_rural_phototex_noon.yaml

  - name: sift_50s_rep2
    scenario: experiments/configs/mvp/scenarios/phase8i_d_loss_flow_flat_rural_phototex_noon.yaml

  - name: sift_50s_rep3
    scenario: experiments/configs/mvp/scenarios/phase8i_d_loss_flow_flat_rural_phototex_noon.yaml
