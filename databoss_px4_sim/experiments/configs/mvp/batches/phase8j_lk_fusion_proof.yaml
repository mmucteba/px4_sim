batch:
  name: phase8j_lk_fusion_proof
  description: >
    One-run Phase 8J LK bridge fusion proof after pre-arm flow advertisement
    and robust LK outlier rejection fixes.

defaults:
  hover_s: 35
  startup_timeout_s: 180
  land_timeout_s: 60
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 10
  post_loss_hover_s: 20
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: lk_fusion_proof
    scenario: experiments/configs/mvp/scenarios/phase8j_d_loss_flow_lk_flat_rural_phototex_noon.yaml
