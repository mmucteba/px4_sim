batch:
  name: phase8k_lk_bounded_vy0p10_smoke
  description: >
    Phase 8K repair smoke. Same LK stock-contract bridge settings as the
    rejected 0.2 m/s smoke, with only the lateral offboard velocity reduced to
    0.1 m/s.

defaults:
  hover_s: 60
  startup_timeout_s: 180
  land_timeout_s: 120
  global_position_gate_enabled: true
  global_position_timeout_s: 150
  global_position_stable_s: 8
  gnss_start_used: 10
  gnss_loss_after_takeoff_s: 10
  post_loss_hover_s: 50
  failsafe_profile: delayed_observation
  qgc:
    enabled: true
    ip: 100.109.200.5
    local_port: 14555
    remote_port: 14550
    rate: 1000000

cases:
  - name: lk_bounded_vy0p10_rep1
    scenario: experiments/configs/mvp/scenarios/phase8k_d_loss_flow_lk_flat_rural_phototex_noon_vy0p10.yaml
