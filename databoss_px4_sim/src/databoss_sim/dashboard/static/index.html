<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DATABOSS Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #ddd; }
  a { color: #6cf; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #333; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
  th { background: #1a1a1a; position: sticky; top: 0; }
  tr:hover { background: #1a1a1a; }
  .status-conformant { color: #7f7; }
  .status-legacy { color: #cc7; }
  .status-in_progress { color: #7cf; }
  .status-incomplete { color: #f77; }
  .filters { margin: 1rem 0; }
  .filters select, .filters input { margin-right: 0.5rem; }
  .kv { display: grid; grid-template-columns: 220px 1fr; gap: 0.3rem 1rem; max-width: 900px; }
  .kv div.k { color: #999; }
  section { margin-bottom: 2rem; }
  h1, h2 { font-weight: 600; }
  code { background: #1a1a1a; padding: 0.1rem 0.3rem; }
</style>
</head>
<body>
<h1><a href="/" style="text-decoration:none;color:inherit;">DATABOSS Dashboard</a></h1>
<div id="app">Loading...</div>
<script>
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ": " + r.status);
  return r.json();
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const c of children || []) e.appendChild(c);
  return e;
}

async function renderList() {
  const app = document.getElementById("app");
  const runs = await getJSON("/api/runs");
  const params = new URLSearchParams(location.search);
  const fAlgo = params.get("algorithm") || "";
  const fGnss = params.get("gnss_state") || "";
  const fStatus = params.get("status") || "";

  const filtered = runs.filter(r =>
    (!fAlgo || r.algorithm === fAlgo) &&
    (!fGnss || r.gnss_state === fGnss) &&
    (!fStatus || r.contract_status === fStatus)
  );

  app.innerHTML = "";
  const summary = el("p", { text: `${filtered.length} of ${runs.length} runs (filters: algorithm=${fAlgo||"any"}, gnss_state=${fGnss||"any"}, status=${fStatus||"any"})` });
  app.appendChild(summary);

  const table = el("table", {});
  const head = el("tr", {}, [
    el("th", { text: "run_id" }), el("th", { text: "phase" }), el("th", { text: "algorithm" }),
    el("th", { text: "gnss_state" }), el("th", { text: "status" }), el("th", { text: "accepted" }),
    el("th", { text: "horiz err max (m)" }),
  ]);
  table.appendChild(head);
  for (const r of filtered.slice(0, 500)) {
    const row = el("tr", {}, [
      el("td", {}, [el("a", { href: `/runs/${r.run_id}`, text: r.run_id })]),
      el("td", { text: r.phase || "" }),
      el("td", { text: r.algorithm || "" }),
      el("td", { text: r.gnss_state || "" }),
      el("td", { text: r.contract_status, class: `status-${r.contract_status}` }),
      el("td", { text: r.accepted === null ? "" : String(r.accepted) }),
      el("td", { text: r.key_metrics.horizontal_error_max_m != null ? r.key_metrics.horizontal_error_max_m.toFixed(3) : "" }),
    ]);
    table.appendChild(row);
  }
  app.appendChild(table);
}

function kv(pairs) {
  const div = el("div", { class: "kv" });
  for (const [k, v] of pairs) {
    div.appendChild(el("div", { class: "k", text: k }));
    div.appendChild(el("div", { text: v === null || v === undefined ? "-" : String(v) }));
  }
  return div;
}

async function renderRun(runId) {
  const app = document.getElementById("app");
  let run;
  try {
    run = await getJSON(`/api/runs/${encodeURIComponent(runId)}`);
  } catch (e) {
    app.innerHTML = "";
    app.appendChild(el("p", { text: "Run not found: " + runId }));
    return;
  }
  app.innerHTML = "";
  app.appendChild(el("p", {}, [el("a", { href: "/", text: "< back to run list" })]));
  app.appendChild(el("h2", { text: run.run_id }));

  const overview = el("section", {}, [
    el("h2", { text: "Overview" }),
    kv([
      ["phase", run.phase], ["scenario_name", run.scenario_name],
      ["algorithm", run.algorithm], ["gnss_state", run.gnss_state],
      ["world_variant", run.world_variant], ["tag_source", run.tag_source],
      ["contract_status", run.contract_status], ["accepted", run.accepted],
      ["created_utc", run.created_utc], ["last_modified_utc", run.last_modified_utc],
    ]),
  ]);
  app.appendChild(overview);

  const metrics = el("section", {}, [
    el("h2", { text: "Key metrics" }),
    kv(Object.entries(run.key_metrics)),
  ]);
  app.appendChild(metrics);

  const conn = run.connections;
  const connections = el("section", {}, [
    el("h2", { text: "Connections" }),
    kv([
      ["QGC enabled", conn.qgc_enabled], ["QGC ip", conn.qgc_ip],
      ["QGC local port", conn.qgc_local_port], ["QGC remote port", conn.qgc_remote_port],
      ["QGC source", conn.qgc_source],
      ["gz-web enabled", conn.gazebo_web_enabled], ["gz-web port", conn.gazebo_web_port],
      ["gz-web publication Hz", conn.gazebo_web_publication_hz],
      ["flow_bridge enabled", conn.flow_bridge_enabled], ["estimator", conn.flow_bridge_estimator],
      ["flow_bridge rate Hz", conn.flow_bridge_rate_hz], ["axis_map", conn.axis_map],
      ["hfov_rad", conn.hfov_rad],
      ["EKF2_OF_CTRL", conn.ekf2_of_ctrl], ["EKF2_OF_QMIN", conn.ekf2_of_qmin],
      ["EKF2_OF_N_MIN", conn.ekf2_of_n_min], ["EKF2_OF_DELAY", conn.ekf2_of_delay],
      ["aiding mode", conn.aiding_mode], ["EKF2_EV_CTRL", conn.ekf2_ev_ctrl],
    ]),
  ]);
  app.appendChild(connections);

  const artifacts = el("section", {}, [
    el("h2", { text: "Artifacts" }),
    el("ul", {}, Object.entries(run.artifacts).map(([k, v]) =>
      el("li", {}, [el("a", { href: `/artifacts/runs/${run.run_id}/${v}`, text: `${k}: ${v}` })])
    )),
  ]);
  app.appendChild(artifacts);

  if (run.comparisons.length) {
    app.appendChild(el("section", {}, [
      el("h2", { text: "Comparisons" }),
      el("ul", {}, run.comparisons.map(c =>
        el("li", {}, [el("a", { href: `/comparisons/${c}`, text: c })])
      )),
    ]));
  }

  if (run.warnings.length) {
    app.appendChild(el("section", {}, [
      el("h2", { text: "Warnings" }),
      el("ul", {}, run.warnings.map(w => el("li", { text: w }))),
    ]));
  }
}

async function renderComparison(comparisonId) {
  const app = document.getElementById("app");
  let comp;
  try {
    comp = await getJSON(`/api/comparisons/${encodeURIComponent(comparisonId)}`);
  } catch (e) {
    app.innerHTML = "";
    app.appendChild(el("p", { text: "Comparison not found: " + comparisonId }));
    return;
  }
  app.innerHTML = "";
  app.appendChild(el("p", {}, [el("a", { href: "/", text: "< back to run list" })]));
  app.appendChild(el("h2", { text: comp.title }));
  app.appendChild(kv([
    ["comparison_id", comp.comparison_id], ["case_count", comp.case_count],
  ]));
  if (comp.has_report_md) {
    app.appendChild(el("p", {}, [
      el("a", { href: `/artifacts/comparisons/${comp.comparison_id}/report.md`, text: "view report.md (raw)" }),
    ]));
  }
  app.appendChild(el("h2", { text: "Runs in this comparison" }));
  app.appendChild(el("ul", {}, comp.run_ids.map(rid =>
    el("li", {}, [el("a", { href: `/runs/${rid}`, text: rid })])
  )));
}

function route() {
  const path = location.pathname;
  const runMatch = path.match(/^\/runs\/(.+)$/);
  const compMatch = path.match(/^\/comparisons\/(.+)$/);
  if (runMatch) return renderRun(decodeURIComponent(runMatch[1]));
  if (compMatch) return renderComparison(decodeURIComponent(compMatch[1]));
  return renderList();
}

route();
</script>
</body>
</html>
