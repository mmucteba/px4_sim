<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DATABOSS Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #ddd; }
  a { color: #6cf; }
  table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
  th, td { border: 1px solid #333; padding: 0.4rem 0.6rem; text-align: left; font-size: 0.9rem; }
  th { background: #1a1a1a; position: sticky; top: 0; }
  tr:hover { background: #1a1a1a; }
  .status-conformant { color: #7f7; }
  .status-legacy { color: #cc7; }
  .status-in_progress { color: #7cf; }
  .status-incomplete { color: #f77; }
  .filters { margin: 1rem 0; }
  .filters select, .filters input { margin-right: 0.5rem; }
  .kv { display: grid; grid-template-columns: 220px 1fr; gap: 0.3rem 1rem; max-width: 900px; }
  .kv div.k { color: #999; }
  section { margin-bottom: 2rem; }
  h1, h2 { font-weight: 600; }
  code { background: #1a1a1a; padding: 0.1rem 0.3rem; }
  form.gen { max-width: 640px; }
  form.gen label { display: block; margin-top: 0.8rem; font-size: 0.9rem; color: #bbb; }
  form.gen input[type=text], form.gen input[type=number], form.gen select, form.gen textarea {
    width: 100%; box-sizing: border-box; background: #1a1a1a; color: #ddd; border: 1px solid #333;
    padding: 0.4rem; margin-top: 0.2rem; font-family: inherit;
  }
  form.gen textarea { font-family: monospace; min-height: 5rem; }
  form.gen button { margin-top: 1.2rem; padding: 0.5rem 1.2rem; background: #2a5; color: #fff; border: none; cursor: pointer; }
  form.gen button:hover { background: #3b6; }
  .run-command { background: #1a1a1a; padding: 0.8rem; margin-top: 0.5rem; word-break: break-all; }
  .warn { color: #fc7; }
  .err { color: #f77; }
  nav { margin-bottom: 1rem; }
  nav a { margin-right: 1rem; }
</style>
</head>
<body>
<h1><a href="/" style="text-decoration:none;color:inherit;">DATABOSS Dashboard</a></h1>
<nav><a href="/">Runs</a><a href="/create">Create</a></nav>
<div id="app">Loading...</div>
<script>
async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ": " + r.status);
  return r.json();
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "text") e.textContent = v;
    else e.setAttribute(k, v);
  }
  for (const c of children || []) e.appendChild(c);
  return e;
}

async function renderList() {
  const app = document.getElementById("app");
  const runs = await getJSON("/api/runs");
  const params = new URLSearchParams(location.search);
  const fAlgo = params.get("algorithm") || "";
  const fGnss = params.get("gnss_state") || "";
  const fStatus = params.get("status") || "";

  const filtered = runs.filter(r =>
    (!fAlgo || r.algorithm === fAlgo) &&
    (!fGnss || r.gnss_state === fGnss) &&
    (!fStatus || r.contract_status === fStatus)
  );

  app.innerHTML = "";
  const summary = el("p", { text: `${filtered.length} of ${runs.length} runs (filters: algorithm=${fAlgo||"any"}, gnss_state=${fGnss||"any"}, status=${fStatus||"any"})` });
  app.appendChild(summary);

  const table = el("table", {});
  const head = el("tr", {}, [
    el("th", { text: "run_id" }), el("th", { text: "phase" }), el("th", { text: "algorithm" }),
    el("th", { text: "gnss_state" }), el("th", { text: "status" }), el("th", { text: "accepted" }),
    el("th", { text: "horiz err max (m)" }),
  ]);
  table.appendChild(head);
  for (const r of filtered.slice(0, 500)) {
    const row = el("tr", {}, [
      el("td", {}, [el("a", { href: `/runs/${r.run_id}`, text: r.run_id })]),
      el("td", { text: r.phase || "" }),
      el("td", { text: r.algorithm || "" }),
      el("td", { text: r.gnss_state || "" }),
      el("td", { text: r.contract_status, class: `status-${r.contract_status}` }),
      el("td", { text: r.accepted === null ? "" : String(r.accepted) }),
      el("td", { text: r.key_metrics.horizontal_error_max_m != null ? r.key_metrics.horizontal_error_max_m.toFixed(3) : "" }),
    ]);
    table.appendChild(row);
  }
  app.appendChild(table);
}

function kv(pairs) {
  const div = el("div", { class: "kv" });
  for (const [k, v] of pairs) {
    div.appendChild(el("div", { class: "k", text: k }));
    div.appendChild(el("div", { text: v === null || v === undefined ? "-" : String(v) }));
  }
  return div;
}

async function renderRun(runId) {
  const app = document.getElementById("app");
  let run;
  try {
    run = await getJSON(`/api/runs/${encodeURIComponent(runId)}`);
  } catch (e) {
    app.innerHTML = "";
    app.appendChild(el("p", { text: "Run not found: " + runId }));
    return;
  }
  app.innerHTML = "";
  app.appendChild(el("p", {}, [el("a", { href: "/", text: "< back to run list" })]));
  app.appendChild(el("h2", { text: run.run_id }));

  const overview = el("section", {}, [
    el("h2", { text: "Overview" }),
    kv([
      ["phase", run.phase], ["scenario_name", run.scenario_name],
      ["algorithm", run.algorithm], ["gnss_state", run.gnss_state],
      ["world_variant", run.world_variant], ["tag_source", run.tag_source],
      ["contract_status", run.contract_status], ["accepted", run.accepted],
      ["created_utc", run.created_utc], ["last_modified_utc", run.last_modified_utc],
    ]),
  ]);
  app.appendChild(overview);

  const metrics = el("section", {}, [
    el("h2", { text: "Key metrics" }),
    kv(Object.entries(run.key_metrics)),
  ]);
  app.appendChild(metrics);

  const conn = run.connections;
  const connections = el("section", {}, [
    el("h2", { text: "Connections" }),
    kv([
      ["QGC enabled", conn.qgc_enabled], ["QGC ip", conn.qgc_ip],
      ["QGC local port", conn.qgc_local_port], ["QGC remote port", conn.qgc_remote_port],
      ["QGC source", conn.qgc_source],
      ["gz-web enabled", conn.gazebo_web_enabled], ["gz-web port", conn.gazebo_web_port],
      ["gz-web publication Hz", conn.gazebo_web_publication_hz],
      ["flow_bridge enabled", conn.flow_bridge_enabled], ["estimator", conn.flow_bridge_estimator],
      ["flow_bridge rate Hz", conn.flow_bridge_rate_hz], ["axis_map", conn.axis_map],
      ["hfov_rad", conn.hfov_rad],
      ["EKF2_OF_CTRL", conn.ekf2_of_ctrl], ["EKF2_OF_QMIN", conn.ekf2_of_qmin],
      ["EKF2_OF_N_MIN", conn.ekf2_of_n_min], ["EKF2_OF_DELAY", conn.ekf2_of_delay],
      ["aiding mode", conn.aiding_mode], ["EKF2_EV_CTRL", conn.ekf2_ev_ctrl],
    ]),
  ]);
  app.appendChild(connections);

  const artifacts = el("section", {}, [
    el("h2", { text: "Artifacts" }),
    el("ul", {}, Object.entries(run.artifacts).map(([k, v]) =>
      el("li", {}, [el("a", { href: `/artifacts/runs/${run.run_id}/${v}`, text: `${k}: ${v}` })])
    )),
  ]);
  app.appendChild(artifacts);

  if (run.comparisons.length) {
    app.appendChild(el("section", {}, [
      el("h2", { text: "Comparisons" }),
      el("ul", {}, run.comparisons.map(c =>
        el("li", {}, [el("a", { href: `/comparisons/${c}`, text: c })])
      )),
    ]));
  }

  if (run.warnings.length) {
    app.appendChild(el("section", {}, [
      el("h2", { text: "Warnings" }),
      el("ul", {}, run.warnings.map(w => el("li", { text: w }))),
    ]));
  }
}

async function renderComparison(comparisonId) {
  const app = document.getElementById("app");
  let comp;
  try {
    comp = await getJSON(`/api/comparisons/${encodeURIComponent(comparisonId)}`);
  } catch (e) {
    app.innerHTML = "";
    app.appendChild(el("p", { text: "Comparison not found: " + comparisonId }));
    return;
  }
  app.innerHTML = "";
  app.appendChild(el("p", {}, [el("a", { href: "/", text: "< back to run list" })]));
  app.appendChild(el("h2", { text: comp.title }));
  app.appendChild(kv([
    ["comparison_id", comp.comparison_id], ["case_count", comp.case_count],
  ]));
  if (comp.has_report_md) {
    app.appendChild(el("p", {}, [
      el("a", { href: `/artifacts/comparisons/${comp.comparison_id}/report.md`, text: "view report.md (raw)" }),
    ]));
  }
  app.appendChild(el("h2", { text: "Runs in this comparison" }));
  app.appendChild(el("ul", {}, comp.run_ids.map(rid =>
    el("li", {}, [el("a", { href: `/runs/${rid}`, text: rid })])
  )));
}

function getToken() {
  return localStorage.getItem("databoss_token") || "";
}
function setToken(v) {
  localStorage.setItem("databoss_token", v);
}

async function postJSON(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Databoss-Token": getToken() },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const err = new Error(data.detail || `${url}: ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return data;
}

async function renderCreate() {
  const app = document.getElementById("app");
  const scenarios = await getJSON("/api/scenarios");
  const vehicleModels = await getJSON("/api/vehicle_models");

  app.innerHTML = "";
  app.appendChild(el("p", { text: "Generates a scenario YAML / world SDF from these inputs and hands back the file plus the exact command to run it yourself. Nothing here starts or stops a simulation." }));

  // --- token ---
  const tokenSection = el("section", {}, [
    el("h2", { text: "Write token" }),
    el("p", { text: "Required for both forms below. Generate one on the host with scripts/dashboard/generate_token.py, then paste it here (stored only in this browser's localStorage)." }),
  ]);
  const tokenInput = el("input", { type: "text", value: getToken(), placeholder: "X-Databoss-Token" });
  tokenInput.addEventListener("change", () => setToken(tokenInput.value.trim()));
  tokenSection.appendChild(tokenInput);
  app.appendChild(tokenSection);

  // --- create scenario ---
  const scenarioSection = el("section", {});
  scenarioSection.appendChild(el("h2", { text: "Create scenario" }));
  const form = el("form", { class: "gen" });

  const sourceSelect = el("select", {}, scenarios.map(s => el("option", { value: s.name, text: s.name })));
  const newNameInput = el("input", { type: "text", placeholder: "new_scenario_name (no .yaml)" });
  const altInput = el("input", { type: "number", step: "0.1", placeholder: "leave blank to keep source value" });
  const lossEnabledSelect = el("select", {}, [
    el("option", { value: "", text: "(keep source value)" }),
    el("option", { value: "true", text: "true" }),
    el("option", { value: "false", text: "false" }),
  ]);
  const lossAfterInput = el("input", { type: "number", step: "0.1", placeholder: "leave blank to keep source value" });
  const failsafeSelect = el("select", {}, [
    el("option", { value: "", text: "(keep source value)" }),
    el("option", { value: "default", text: "default" }),
    el("option", { value: "delayed_observation", text: "delayed_observation" }),
  ]);
  const estimatorSelect = el("select", {}, [
    el("option", { value: "", text: "(keep source value)" }),
    el("option", { value: "lk", text: "lk" }),
    el("option", { value: "sift", text: "sift" }),
  ]);
  const modelSelect = el("select", {}, [
    el("option", { value: "", text: "(keep source value)" }),
    ...vehicleModels.map(m => el("option", { value: m, text: m })),
  ]);
  const gnssStartSelect = el("select", {}, [
    el("option", { value: "", text: "(don't override --gnss-start-used)" }),
    el("option", { value: "10", text: "10 (GNSS available at start)" }),
    el("option", { value: "0", text: "0 (GNSS unavailable at start)" }),
  ]);
  const extraEditsInput = el("textarea", { placeholder: '{"control.vx_m_s": 0.5}  (raw JSON, dotted paths, merged in - any non-editable path is rejected and reported, not silently dropped)' });

  for (const [label, node] of [
    ["Source scenario", sourceSelect], ["New scenario name", newNameInput],
    ["route.altitude_agl_m", altInput], ["gnss.loss_enabled", lossEnabledSelect],
    ["gnss.loss_after_takeoff_s", lossAfterInput], ["failsafe.profile", failsafeSelect],
    ["flow_bridge.estimator", estimatorSelect], ["vehicle.model", modelSelect],
    ["--gnss-start-used (CLI flag, not a YAML edit)", gnssStartSelect],
    ["Additional edits (raw JSON)", extraEditsInput],
  ]) {
    form.appendChild(el("label", { text: label }));
    form.appendChild(node);
  }

  const submitBtn = el("button", { type: "submit", text: "Create scenario" });
  form.appendChild(submitBtn);
  const resultDiv = el("div", {});
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    resultDiv.innerHTML = "";
    const edits = {};
    if (altInput.value !== "") edits["route.altitude_agl_m"] = parseFloat(altInput.value);
    if (lossEnabledSelect.value !== "") edits["gnss.loss_enabled"] = lossEnabledSelect.value === "true";
    if (lossAfterInput.value !== "") edits["gnss.loss_after_takeoff_s"] = parseFloat(lossAfterInput.value);
    if (failsafeSelect.value !== "") edits["failsafe.profile"] = failsafeSelect.value;
    if (estimatorSelect.value !== "") edits["flow_bridge.estimator"] = estimatorSelect.value;
    if (modelSelect.value !== "") edits["vehicle.model"] = modelSelect.value;
    if (extraEditsInput.value.trim() !== "") {
      try {
        Object.assign(edits, JSON.parse(extraEditsInput.value));
      } catch (e) {
        resultDiv.appendChild(el("p", { class: "err", text: "Additional edits is not valid JSON: " + e.message }));
        return;
      }
    }
    const body = {
      source_scenario: sourceSelect.value,
      new_name: newNameInput.value.trim(),
      edits,
    };
    if (gnssStartSelect.value !== "") body.gnss_start_used = parseInt(gnssStartSelect.value, 10);

    try {
      const data = await postJSON("/api/scenarios", body);
      resultDiv.innerHTML = "";
      resultDiv.appendChild(el("p", { text: "Created: " + data.path }));
      if (data.rejected_edits.length) {
        resultDiv.appendChild(el("p", { class: "warn", text: "Rejected (not editable, left unchanged): " + data.rejected_edits.join(", ") }));
      }
      if (data.confound.is_confounded) {
        resultDiv.appendChild(el("p", { class: "warn", text: "Confound warning: multiple field groups changed at once (" + data.confound.blocks_changed.join(", ") + ") - not a single-variable diff from the source scenario." }));
      }
      resultDiv.appendChild(el("p", { text: "Run this yourself:" }));
      resultDiv.appendChild(el("div", { class: "run-command", text: data.run_command }));
    } catch (e) {
      resultDiv.appendChild(el("p", { class: "err", text: (e.status || "") + " " + e.message }));
    }
  });

  scenarioSection.appendChild(form);
  scenarioSection.appendChild(resultDiv);
  app.appendChild(scenarioSection);

  // --- create world ---
  const worldSection = el("section", {});
  worldSection.appendChild(el("h2", { text: "Create world" }));
  const wform = el("form", { class: "gen" });
  const wNewName = el("input", { type: "text", placeholder: "new_world_name (no .yaml)" });
  const wSizeX = el("input", { type: "number", value: "120" });
  const wSizeY = el("input", { type: "number", value: "120" });
  const wPattern = el("select", {}, [
    el("option", { value: "uniform_field", text: "uniform_field" }),
    el("option", { value: "checker_field", text: "checker_field" }),
  ]);
  const wWind = el("select", {}, [
    el("option", { value: "false", text: "false" }),
    el("option", { value: "true", text: "true (only works if this world generator supports wind - check before relying on it)" }),
  ]);
  const wWindMean = el("input", { type: "number", step: "0.1", placeholder: "wind mean_mps (only used if wind=true)" });
  const wPadEnabled = el("select", {}, [
    el("option", { value: "true", text: "true (default, at world origin 0,0)" }),
    el("option", { value: "false", text: "false" }),
  ]);
  for (const [label, node] of [
    ["New world name", wNewName], ["size_m.x", wSizeX], ["size_m.y", wSizeY],
    ["texture.visual_pattern", wPattern], ["wind.enabled", wWind], ["wind.mean_mps", wWindMean],
    ["pad.enabled", wPadEnabled],
  ]) {
    wform.appendChild(el("label", { text: label }));
    wform.appendChild(node);
  }
  const wSubmitBtn = el("button", { type: "submit", text: "Create world" });
  wform.appendChild(wSubmitBtn);
  const wResultDiv = el("div", {});
  wform.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    wResultDiv.innerHTML = "";
    const body = {
      new_name: wNewName.value.trim(),
      size_m: { x: parseFloat(wSizeX.value), y: parseFloat(wSizeY.value) },
      texture: { visual_pattern: wPattern.value },
      lighting: {},
      wind: wWindMean.value !== ""
        ? { enabled: wWind.value === "true", mean_mps: parseFloat(wWindMean.value) }
        : { enabled: wWind.value === "true" },
      pad: { enabled: wPadEnabled.value === "true" },
    };
    try {
      const data = await postJSON("/api/worlds/generate", body);
      wResultDiv.innerHTML = "";
      wResultDiv.appendChild(el("p", { text: "Created: " + data.world_config_path }));
      wResultDiv.appendChild(el("p", { text: "Generated SDF: " + data.sdf_path }));
    } catch (e) {
      wResultDiv.appendChild(el("p", { class: "err", text: (e.status || "") + " " + e.message }));
    }
  });
  worldSection.appendChild(wform);
  worldSection.appendChild(wResultDiv);
  app.appendChild(worldSection);
}

function route() {
  const path = location.pathname;
  const runMatch = path.match(/^\/runs\/(.+)$/);
  const compMatch = path.match(/^\/comparisons\/(.+)$/);
  if (path === "/create") return renderCreate();
  if (runMatch) return renderRun(decodeURIComponent(runMatch[1]));
  if (compMatch) return renderComparison(decodeURIComponent(compMatch[1]));
  return renderList();
}

route();
</script>
</body>
</html>
